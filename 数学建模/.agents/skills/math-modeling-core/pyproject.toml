[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "math-modeling-core"
version = "0.1.0"
description = "Local contracts and runtime for validated mathematical modeling workflows"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.14"]

[project.optional-dependencies]
forecasting = ["statsmodels>=0.14"]
ml = ["scikit-learn>=1.5"]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=9.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
