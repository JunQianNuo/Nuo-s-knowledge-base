<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">双方先发送，为什么走不到接收</title><desc id="desc">假设两个MPI_Send的完成都需要对端开始匹配接收；两端因此停在Send，后续Recv尚未执行，形成循环等待。虚线箭头是依赖关系，不表示已发送消息。</desc>
<defs><style>text{font-family:"Hiragino Sans GB","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#112C43}.code{font-family:"SFMono-Regular",Consolas,monospace}</style>
<marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147F85"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#506574"/></marker><marker id="amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#D78738"/></marker></defs>
<rect width="1200" height="650" fill="white"/>
<text x="44" y="50" font-size="30" font-weight="700" style="fill:#112C43" text-anchor="start">双方都先 Send：下一行 Recv 为什么执行不到？</text>
<text x="44" y="88" font-size="22" font-weight="400" style="fill:#506574" text-anchor="start">下图讨论：两个标准发送都需要对端先开始匹配接收，才能完成。</text>
<text x="325" y="140" font-size="26" font-weight="700" style="fill:#112C43" text-anchor="middle">rank 0</text>
<text x="875" y="140" font-size="26" font-weight="700" style="fill:#112C43" text-anchor="middle">rank 1</text>
<path d="M85 165V492" fill="none" stroke="#506574" stroke-width="3" marker-end="url(#gray)"/>
<text x="85" y="526" font-size="20" font-weight="400" style="fill:#506574" text-anchor="middle">时间向下</text>
<rect x="160" y="180" width="330" height="110" rx="12" fill="#FFF3E7" stroke="#D78738" stroke-width="2"/>
<text x="325" y="218" font-size="25" font-weight="700" style="fill:#112C43" text-anchor="middle" class="code">MPI_Send(...)</text>
<text x="325" y="261" font-size="23" font-weight="400" style="fill:#112C43" text-anchor="middle">等对方的接收开始</text>
<path d="M325 292V334" fill="none" stroke="#D78738" stroke-width="4"/>
<path d="M307 334H343" fill="none" stroke="#D78738" stroke-width="5"/>
<text x="325" y="373" font-size="21" font-weight="400" style="fill:#D78738" text-anchor="middle">当前调用未返回</text>
<rect x="160" y="416" width="330" height="85" rx="12" fill="#F7FAFB" stroke="#D6E3E8" stroke-width="2" stroke-dasharray="7 5"/>
<text x="325" y="452" font-size="25" font-weight="400" style="fill:#112C43" text-anchor="middle" class="code">MPI_Recv(...)</text>
<text x="325" y="483" font-size="21" font-weight="400" style="fill:#506574" text-anchor="middle">下一行，尚未执行</text>
<rect x="710" y="180" width="330" height="110" rx="12" fill="#FFF3E7" stroke="#D78738" stroke-width="2"/>
<text x="875" y="218" font-size="25" font-weight="700" style="fill:#112C43" text-anchor="middle" class="code">MPI_Send(...)</text>
<text x="875" y="261" font-size="23" font-weight="400" style="fill:#112C43" text-anchor="middle">等对方的接收开始</text>
<path d="M875 292V334" fill="none" stroke="#D78738" stroke-width="4"/>
<path d="M857 334H893" fill="none" stroke="#D78738" stroke-width="5"/>
<text x="875" y="373" font-size="21" font-weight="400" style="fill:#D78738" text-anchor="middle">当前调用未返回</text>
<rect x="710" y="416" width="330" height="85" rx="12" fill="#F7FAFB" stroke="#D6E3E8" stroke-width="2" stroke-dasharray="7 5"/>
<text x="875" y="452" font-size="25" font-weight="400" style="fill:#112C43" text-anchor="middle" class="code">MPI_Recv(...)</text>
<text x="875" y="483" font-size="21" font-weight="400" style="fill:#506574" text-anchor="middle">下一行，尚未执行</text>
<path d="M492 246L708 442" fill="none" stroke="#D78738" stroke-width="3" marker-end="url(#amber)" stroke-dasharray="8 6"/>
<path d="M708 246L492 442" fill="none" stroke="#D78738" stroke-width="3" marker-end="url(#amber)" stroke-dasharray="8 6"/>
<rect x="501" y="321" width="198" height="56" rx="12" fill="white" stroke="#D78738" stroke-width="2"/>
<text x="600" y="357" font-size="25" font-weight="700" style="fill:#D78738" text-anchor="middle">互相等待</text>
<text x="600" y="554" font-size="21" font-weight="400" style="fill:#506574" text-anchor="middle">虚线箭头表示：当前发送的完成依赖对端启动接收。</text>
<text x="600" y="594" font-size="21" font-weight="400" style="fill:#506574" text-anchor="middle">大消息的握手传输常会暴露这种依赖；MPI_Send 仍然使用标准模式。</text>
<text x="600" y="628" font-size="21" font-weight="400" style="fill:#506574" text-anchor="middle">小消息也不能保证安全；使用何种协议及其阈值取决于实现与环境。</text>
</svg>
