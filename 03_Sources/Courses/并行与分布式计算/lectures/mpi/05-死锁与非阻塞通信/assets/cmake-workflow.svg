<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">CMake配置构建与测试流程</title><desc id="desc">项目的CMakeLists源码和依赖经配置生成本机构建规则。在build目录中cmake ..生成Makefile，make编译链接，生成可执行程序。之后ctest运行已注册测试，普通ctest不自动重编译。</desc><defs><style>
.title{font:700 30px 'Hiragino Sans GB','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#112C43}
.body{font:23px 'Hiragino Sans GB','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#112C43}
.label{font:700 23px 'Hiragino Sans GB','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#112C43}
.small{font:20px 'Hiragino Sans GB','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#506574}
.code{font:23px 'SFMono-Regular',Consolas,monospace;fill:#112C43}
.codesmall{font:19px 'SFMono-Regular',Consolas,monospace;fill:#112C43}
</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147F85"/></marker><marker id="greyarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#506574"/></marker></defs><rect width="1200" height="700" fill="#F7FAFB"/><text x="44" y="50" class="body" text-anchor="start" >CMake 生成规则，Make 编译，CTest 测试</text><text x="44" y="90" class="small" text-anchor="start" >先创建并进入 build 目录；以下命令都在 build 中执行。</text><rect x="44" y="145" width="238" height="186" rx="14" fill="white" stroke="#DCE6EA" stroke-width="2"/><text x="62" y="180" class="label" text-anchor="start" >1  项目输入</text><text x="62" y="223" class="small" text-anchor="start" >CMakeLists.txt</text><text x="62" y="257" class="small" text-anchor="start" >C / C++ 源码</text><text x="62" y="291" class="small" text-anchor="start" >MPI、GoogleTest</text><rect x="336" y="145" width="238" height="186" rx="14" fill="#E9F4F2" stroke="#147F85" stroke-width="2"/><text x="354" y="180" class="label" text-anchor="start" >2  配置与生成</text><text x="354" y="223" class="small" text-anchor="start" >识别编译器</text><text x="354" y="257" class="small" text-anchor="start" >寻找依赖</text><text x="354" y="291" class="small" text-anchor="start" >生成构建规则</text><rect x="628" y="145" width="238" height="186" rx="14" fill="white" stroke="#DCE6EA" stroke-width="2"/><text x="646" y="180" class="label" text-anchor="start" >3  实际构建</text><text x="646" y="223" class="small" text-anchor="start" >Make 调度构建</text><text x="646" y="257" class="small" text-anchor="start" >编译源文件</text><text x="646" y="291" class="small" text-anchor="start" >链接程序与库</text><rect x="920" y="145" width="238" height="186" rx="14" fill="white" stroke="#DCE6EA" stroke-width="2"/><text x="938" y="180" class="label" text-anchor="start" >4  构建产物</text><text x="938" y="223" class="small" text-anchor="start" >可执行程序</text><text x="938" y="257" class="small" text-anchor="start" >GoogleTest 程序</text><text x="938" y="291" class="small" text-anchor="start" >目标文件与库</text><path d="M285 238H329" fill="none" stroke="#147F85" stroke-width="3" marker-end="url(#arrow)"/><path d="M577 238H621" fill="none" stroke="#147F85" stroke-width="3" marker-end="url(#arrow)"/><path d="M869 238H913" fill="none" stroke="#147F85" stroke-width="3" marker-end="url(#arrow)"/><rect x="44" y="376" width="1114" height="70" rx="14" fill="white" stroke="#DCE6EA" stroke-width="2"/><text x="64" y="405" class="label" text-anchor="start" >配置 / 生成</text><text x="265" y="405" class="code" text-anchor="start" >cmake ..</text><text x="265" y="432" class="small" text-anchor="start" >读取上一级的 CMakeLists.txt，在当前目录生成 Makefile 和配置缓存。</text><rect x="44" y="460" width="1114" height="70" rx="14" fill="white" stroke="#DCE6EA" stroke-width="2"/><text x="64" y="490" class="label" text-anchor="start" >编译 / 链接</text><text x="265" y="490" class="code" text-anchor="start" >make</text><text x="265" y="517" class="small" text-anchor="start" >Make 根据生成的依赖关系，调度编译器和链接器。</text><rect x="44" y="544" width="1114" height="70" rx="14" fill="#E9F4F2" stroke="#147F85" stroke-width="2"/><text x="64" y="574" class="label" text-anchor="start" >运行测试</text><text x="265" y="574" class="code" text-anchor="start" >ctest</text><text x="265" y="601" class="small" text-anchor="start" >CTest 运行已注册的测试；普通 ctest 命令不会先替你重新编译。</text><text x="600" y="660" class="small" text-anchor="middle" >先配置，再构建，最后运行或测试。build 是生成目录，不提交到 Git。</text></svg>
