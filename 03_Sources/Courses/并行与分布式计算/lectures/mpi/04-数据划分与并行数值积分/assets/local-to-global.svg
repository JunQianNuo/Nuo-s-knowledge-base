<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">局部求和到根进程汇总</title>
<desc id="desc">四个rank各自计算局部函数值之和S0至S3。rank 0保留S0，rank 1、2、3分别以MPI_Send发送一个MPI_DOUBLE，目标rank 0，tag为10，通信域为MPI_COMM_WORLD。rank 0用MPI_Recv依次接收并累加，最后乘以h得到积分近似。本图只表示数据流和依赖，不表示统一时钟或实际通信耗时。</desc>
<defs><style>
.title{font:700 29px 'Hiragino Sans GB','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#112C43}
.body{font:22px 'Hiragino Sans GB','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#112C43}
.label{font:700 23px 'Hiragino Sans GB','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#112C43}
.small{font:19px 'Hiragino Sans GB','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#506574}
.code{font:22px 'SFMono-Regular',Consolas,monospace;fill:#112C43}
.rank{font:700 24px 'SFMono-Regular',Consolas,monospace;fill:#FFFFFF}
</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147F85"/></marker>
<marker id="axis" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#506574"/></marker>
</defs>
<rect width="1200" height="700" fill="#F7FAFB"/>
<text x="44" y="48" class="body" text-anchor="start" >局部计算完成后，把局部和交给 rank 0</text>
<text x="44" y="88" class="body" text-anchor="start" >各 rank 计算 Sᵣ = Σ f(xᵢ)，其中 i 只遍历自己的下标区间。</text>
<rect x="48" y="124" width="224" height="113" fill="#FFFFFF" rx="12" stroke="#DCE6EA" stroke-width="1.5"/>
<rect x="48" y="124" width="224" height="43" fill="#147F85" rx="12" />
<rect x="48" y="146" width="224" height="21" fill="#147F85" rx="0" />
<text x="160" y="154" class="rank" text-anchor="middle" >rank 0</text>
<text x="160" y="213" class="label" text-anchor="middle" >S₀</text>
<rect x="341" y="124" width="224" height="113" fill="#FFFFFF" rx="12" stroke="#DCE6EA" stroke-width="1.5"/>
<rect x="341" y="124" width="224" height="43" fill="#386889" rx="12" />
<rect x="341" y="146" width="224" height="21" fill="#386889" rx="0" />
<text x="453" y="154" class="rank" text-anchor="middle" >rank 1</text>
<text x="453" y="213" class="label" text-anchor="middle" >S₁</text>
<rect x="634" y="124" width="224" height="113" fill="#FFFFFF" rx="12" stroke="#DCE6EA" stroke-width="1.5"/>
<rect x="634" y="124" width="224" height="43" fill="#386889" rx="12" />
<rect x="634" y="146" width="224" height="21" fill="#386889" rx="0" />
<text x="746" y="154" class="rank" text-anchor="middle" >rank 2</text>
<text x="746" y="213" class="label" text-anchor="middle" >S₂</text>
<rect x="927" y="124" width="224" height="113" fill="#FFFFFF" rx="12" stroke="#DCE6EA" stroke-width="1.5"/>
<rect x="927" y="124" width="224" height="43" fill="#386889" rx="12" />
<rect x="927" y="146" width="224" height="21" fill="#386889" rx="0" />
<text x="1039" y="154" class="rank" text-anchor="middle" >rank 3</text>
<text x="1039" y="213" class="label" text-anchor="middle" >S₃</text>
<path d="M160 239V385" fill="none" stroke="#147F85" stroke-width="3" marker-end="url(#arrow)"/>
<text x="186" y="302" class="small" text-anchor="start" >本地保留 S₀</text>
<path d="M453 239V272" fill="none" stroke="#147F85" stroke-width="3" />
<text x="453" y="309" class="code" text-anchor="middle" >MPI_Send</text>
<path d="M453 325V343H480V385" fill="none" stroke="#147F85" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M746 239V272" fill="none" stroke="#147F85" stroke-width="3" />
<text x="746" y="309" class="code" text-anchor="middle" >MPI_Send</text>
<path d="M746 325V359H580V385" fill="none" stroke="#147F85" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1039 239V272" fill="none" stroke="#147F85" stroke-width="3" />
<text x="1039" y="309" class="code" text-anchor="middle" >MPI_Send</text>
<path d="M1039 325V375H680V385" fill="none" stroke="#147F85" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="390" width="1080" height="110" fill="#E9F4F2" rx="14" stroke="#147F85" stroke-width="1.7"/>
<text x="90" y="431" class="label" text-anchor="start" >rank 0</text>
<text x="90" y="471" class="code" text-anchor="start" >MPI_Recv</text>
<text x="350" y="432" class="body" text-anchor="start" >按源 rank = 1, 2, 3 接收并累加</text>
<text x="350" y="474" class="code" text-anchor="start" >sum = S₀ + S₁ + S₂ + S₃</text>
<rect x="60" y="522" width="650" height="70" fill="#FFFFFF" rx="12" stroke="#DCE6EA" stroke-width="1.5"/>
<text x="83" y="551" class="small" text-anchor="start" >每条消息：count = 1，datatype = MPI_DOUBLE</text>
<text x="83" y="579" class="small" text-anchor="start" >dest = 0，tag = 10，comm = MPI_COMM_WORLD</text>
<path d="M950 500V535" fill="none" stroke="#147F85" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="780" y="540" width="360" height="60" fill="#FFF1E2" rx="12" />
<text x="960" y="578" class="label" text-anchor="middle">I<tspan baseline-shift="sub" font-size="16">N</tspan><tspan baseline-shift="baseline"> = h × sum</tspan></text>
<text x="600" y="640" class="small" text-anchor="middle" >rank 0 也参与局部计算；最终积分结果由 rank 0 保存和输出。</text>
<text x="600" y="676" class="small" text-anchor="middle" >箭头表示数据依赖；图中位置与长度不表示同步时钟或实际耗时。</text>
</svg>
