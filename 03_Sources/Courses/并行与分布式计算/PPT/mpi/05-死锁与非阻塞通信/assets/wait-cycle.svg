<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">同步发送的循环等待</title><desc id="desc">两个rank均先同步发送再接收。发送0依赖接收1开始，接收1依赖发送1返回，发送1依赖接收0开始，接收0依赖发送0返回，形成循环。</desc><defs><style>
.title{font:700 30px 'Hiragino Sans GB','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#112C43}
.body{font:23px 'Hiragino Sans GB','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#112C43}
.label{font:700 23px 'Hiragino Sans GB','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#112C43}
.small{font:20px 'Hiragino Sans GB','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#506574}
.code{font:23px 'SFMono-Regular',Consolas,monospace;fill:#112C43}
.codesmall{font:19px 'SFMono-Regular',Consolas,monospace;fill:#112C43}
</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147F85"/></marker><marker id="greyarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#506574"/></marker></defs><rect width="1200" height="690" fill="#F7FAFB"/><text x="44" y="50" class="body" text-anchor="start" >同步发送：两个进程互相等待</text><text x="44" y="90" class="small" text-anchor="start" >两端都先调用 MPI_Ssend，再调用 MPI_Recv；匹配接收尚未开始。</text><rect x="55" y="155" width="460" height="135" rx="14" fill="#E9F4F2" stroke="#147F85" stroke-width="2"/><text x="79" y="188" class="label" text-anchor="start" >rank 0</text><text x="79" y="232" class="code" text-anchor="start" >MPI_Ssend → rank 1</text><text x="79" y="266" class="small" text-anchor="start" >正在等待匹配接收</text><rect x="685" y="155" width="460" height="135" rx="14" fill="white" stroke="#DCE6EA" stroke-width="2" stroke-dasharray="8 6"/><text x="709" y="188" class="label" text-anchor="start" >rank 1</text><text x="709" y="232" class="code" text-anchor="start" >MPI_Recv ← rank 0</text><text x="709" y="266" class="small" text-anchor="start" >后续语句，尚未执行</text><rect x="685" y="415" width="460" height="135" rx="14" fill="#E9F4F2" stroke="#147F85" stroke-width="2"/><text x="709" y="448" class="label" text-anchor="start" >rank 1</text><text x="709" y="492" class="code" text-anchor="start" >MPI_Ssend → rank 0</text><text x="709" y="526" class="small" text-anchor="start" >正在等待匹配接收</text><rect x="55" y="415" width="460" height="135" rx="14" fill="white" stroke="#DCE6EA" stroke-width="2" stroke-dasharray="8 6"/><text x="79" y="448" class="label" text-anchor="start" >rank 0</text><text x="79" y="492" class="code" text-anchor="start" >MPI_Recv ← rank 1</text><text x="79" y="526" class="small" text-anchor="start" >后续语句，尚未执行</text><path d="M515 222H680" fill="none" stroke="#147F85" stroke-width="3" marker-end="url(#arrow)"/><path d="M915 295V408" fill="none" stroke="#147F85" stroke-width="3" marker-end="url(#arrow)"/><path d="M680 482H520" fill="none" stroke="#147F85" stroke-width="3" marker-end="url(#arrow)"/><path d="M285 410V297" fill="none" stroke="#147F85" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="169" class="small" text-anchor="middle" >需接收开始</text><text x="945" y="345" class="small" text-anchor="start" >需发送</text><text x="945" y="375" class="small" text-anchor="start" >先返回</text><text x="600" y="527" class="small" text-anchor="middle" >需接收开始</text><text x="183" y="345" class="small" text-anchor="start" >需发送</text><text x="183" y="375" class="small" text-anchor="start" >先返回</text><rect x="406" y="324" width="388" height="62" rx="14" fill="#FFF3E7" stroke="#D78738" stroke-width="2"/><text x="600" y="364" class="label" text-anchor="middle" >循环等待：没有可继续的一方</text><text x="600" y="612" class="small" text-anchor="middle" >箭头 A → B 表示：A 的继续执行依赖 B。这里的箭头不是消息传输。</text><text x="600" y="652" class="small" text-anchor="middle" >把 Ssend 换为 Send 后，是否卡住可能受内部缓冲影响；程序仍不应依赖缓冲。</text></svg>
