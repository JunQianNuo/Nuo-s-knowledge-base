<text x="844" y="194" class="code" text-anchor="start" >f(x) = 4 / (1 + x²)</text>
<path d="M844 220H1132" fill="none" stroke="#DCE6EA" stroke-width="1.5" />
<text x="844" y="259" class="label" text-anchor="start" >矩形面积之和</text>
<text x="844" y="303" class="code" text-anchor="start" >I₄ = h × Σ f(xᵢ)</text>
<text x="844" y="344" class="code" text-anchor="start" >≈ 3.146800518</text>
<text x="844" y="406" class="body" text-anchor="start" >精确积分：π</text>
<text x="844" y="444" class="small" text-anchor="start" >近似值与精确值有差异。</text>
<text x="600" y="643" class="small" text-anchor="middle" >图中的曲线与矩形按实际函数值绘制；N 越大，矩形通常越能刻画曲线。</text>
