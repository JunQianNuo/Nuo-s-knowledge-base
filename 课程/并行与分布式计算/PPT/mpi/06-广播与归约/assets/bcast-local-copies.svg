<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">广播：把 root 的值复制到各 rank 的本地变量</title><desc id="desc">四个rank各有独立的n。调用前rank0的n为10，其他rank初始化为-1。四个rank调用MPI_Bcast，root为0。各自调用返回后，各rank的n均为10。前后状态不表示共同返回时刻。</desc>
<defs><style>text{font-family:"Hiragino Sans GB","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#112C43}.code{font-family:"SFMono-Regular",Consolas,monospace}</style><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147F85"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#506574"/></marker></defs>
<rect width="1200" height="650" fill="white"/>
<text x="42" y="49" font-size="30" font-weight="700" fill="#112C43" style="fill:#112C43" text-anchor="start">广播：复制的是值，各 rank 仍有自己的变量</text>
<text x="42" y="89" font-size="22" font-weight="400" fill="#506574" style="fill:#506574" text-anchor="start">本例：4 个 rank，root = 0，广播 1 个 int；所有 rank 都调用 MPI_Bcast。</text>
<text x="95" y="216" font-size="25" font-weight="700" fill="#112C43" style="fill:#112C43" text-anchor="middle">调用前</text>
<text x="280" y="148" font-size="24" font-weight="700" fill="#147F85" style="fill:#147F85" text-anchor="middle">rank 0 · root</text>
<rect x="175" y="170" width="210" height="95" rx="12" fill="#FFF3E7" stroke="#D78738" stroke-width="2"/>
<text x="280" y="228" font-size="30" font-weight="700" fill="#112C43" style="fill:#112C43" text-anchor="middle" class="code">n = 10</text>
<path d="M280 267V319" fill="none" stroke="#506574" stroke-width="3" marker-end="url(#gray)"/>
<text x="530" y="148" font-size="24" font-weight="700" fill="#112C43" style="fill:#112C43" text-anchor="middle">rank 1</text>
<rect x="425" y="170" width="210" height="95" rx="12" fill="#F7FAFB" stroke="#D6E3E8" stroke-width="2"/>
<text x="530" y="228" font-size="30" font-weight="700" fill="#112C43" style="fill:#112C43" text-anchor="middle" class="code">n = -1</text>
<path d="M530 267V319" fill="none" stroke="#506574" stroke-width="3" marker-end="url(#gray)"/>
<text x="780" y="148" font-size="24" font-weight="700" fill="#112C43" style="fill:#112C43" text-anchor="middle">rank 2</text>
<rect x="675" y="170" width="210" height="95" rx="12" fill="#F7FAFB" stroke="#D6E3E8" stroke-width="2"/>
<text x="780" y="228" font-size="30" font-weight="700" fill="#112C43" style="fill:#112C43" text-anchor="middle" class="code">n = -1</text>
<path d="M780 267V319" fill="none" stroke="#506574" stroke-width="3" marker-end="url(#gray)"/>
<text x="1030" y="148" font-size="24" font-weight="700" fill="#112C43" style="fill:#112C43" text-anchor="middle">rank 3</text>
<rect x="925" y="170" width="210" height="95" rx="12" fill="#F7FAFB" stroke="#D6E3E8" stroke-width="2"/>
<text x="1030" y="228" font-size="30" font-weight="700" fill="#112C43" style="fill:#112C43" text-anchor="middle" class="code">n = -1</text>
<path d="M1030 267V319" fill="none" stroke="#506574" stroke-width="3" marker-end="url(#gray)"/>
<rect x="175" y="323" width="960" height="80" rx="12" fill="#E9F4F2" stroke="#147F85" stroke-width="2"/>
<text x="655" y="355" font-size="23" font-weight="400" fill="#112C43" style="fill:#112C43" text-anchor="middle" class="code">MPI_Bcast(&amp;n, 1, MPI_INT, 0, MPI_COMM_WORLD)</text>
<text x="655" y="385" font-size="22" font-weight="400" fill="#147F85" style="fill:#147F85" text-anchor="middle">以 rank 0 的 n 为数据来源</text>
<text x="95" y="481" font-size="24" font-weight="700" fill="#112C43" style="fill:#112C43" text-anchor="middle">各自</text>
<text x="95" y="515" font-size="24" font-weight="700" fill="#112C43" style="fill:#112C43" text-anchor="middle">返回后</text>
<path d="M280 405V453" fill="none" stroke="#147F85" stroke-width="3" marker-end="url(#teal)"/>
<rect x="175" y="458" width="210" height="80" rx="12" fill="#E9F4F2" stroke="#147F85" stroke-width="2"/>
<text x="280" y="509" font-size="30" font-weight="700" fill="#112C43" style="fill:#112C43" text-anchor="middle" class="code">n = 10</text>
<path d="M530 405V453" fill="none" stroke="#147F85" stroke-width="3" marker-end="url(#teal)"/>
<rect x="425" y="458" width="210" height="80" rx="12" fill="#E9F4F2" stroke="#147F85" stroke-width="2"/>
<text x="530" y="509" font-size="30" font-weight="700" fill="#112C43" style="fill:#112C43" text-anchor="middle" class="code">n = 10</text>
<path d="M780 405V453" fill="none" stroke="#147F85" stroke-width="3" marker-end="url(#teal)"/>
<rect x="675" y="458" width="210" height="80" rx="12" fill="#E9F4F2" stroke="#147F85" stroke-width="2"/>
<text x="780" y="509" font-size="30" font-weight="700" fill="#112C43" style="fill:#112C43" text-anchor="middle" class="code">n = 10</text>
<path d="M1030 405V453" fill="none" stroke="#147F85" stroke-width="3" marker-end="url(#teal)"/>
<rect x="925" y="458" width="210" height="80" rx="12" fill="#E9F4F2" stroke="#147F85" stroke-width="2"/>
<text x="1030" y="509" font-size="30" font-weight="700" fill="#112C43" style="fill:#112C43" text-anchor="middle" class="code">n = 10</text>
<text x="600" y="592" font-size="21" font-weight="400" fill="#506574" style="fill:#506574" text-anchor="middle">箭头表示同一 rank 的调用前后状态，不表示实际网络传输路径。</text>
<text x="600" y="626" font-size="21" font-weight="400" fill="#506574" style="fill:#506574" text-anchor="middle">各自返回后本地 n 可用；不要求所有 rank 同时返回。</text>
</svg>
