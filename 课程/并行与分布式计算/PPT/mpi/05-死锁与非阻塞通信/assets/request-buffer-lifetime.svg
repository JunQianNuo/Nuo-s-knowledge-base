<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">MPI请求与缓冲区生命周期</title><desc id="desc">某个进程先Irecv再Isend，进行无关计算，然后Waitall两个请求。接收缓冲从Irecv开始到对应请求完成前不可访问，发送缓冲从Isend开始到对应请求完成前不可修改。图以Waitall正常返回确认完成，不表示全局屏障。</desc><defs><style>
.title{font:700 30px 'Hiragino Sans GB','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#112C43}
.body{font:23px 'Hiragino Sans GB','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#112C43}
.label{font:700 23px 'Hiragino Sans GB','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#112C43}
.small{font:20px 'Hiragino Sans GB','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#506574}
.code{font:23px 'SFMono-Regular',Consolas,monospace;fill:#112C43}
.codesmall{font:19px 'SFMono-Regular',Consolas,monospace;fill:#112C43}
</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147F85"/></marker><marker id="greyarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#506574"/></marker></defs><rect width="1200" height="680" fill="#F7FAFB"/><text x="44" y="50" class="body" text-anchor="start" >非阻塞通信：请求与缓冲区的生命周期</text><text x="44" y="90" class="small" text-anchor="start" >同一进程的程序顺序示意；横向长度不代表实际耗时。</text><path d="M70 151H1140" fill="none" stroke="#506574" stroke-width="3"/><path d="M1137 145L1148 151L1137 157Z" fill="#506574"/><text x="1145" y="130" class="small" text-anchor="end" >程序顺序</text><circle cx="260" cy="151" r="7" fill="#147F85"/><text x="260" y="193" class="code" text-anchor="middle" >MPI_Irecv</text><text x="260" y="227" class="small" text-anchor="middle" >req[0]</text><circle cx="460" cy="151" r="7" fill="#147F85"/><text x="460" y="193" class="code" text-anchor="middle" >MPI_Isend</text><text x="460" y="227" class="small" text-anchor="middle" >req[1]</text><circle cx="775" cy="151" r="7" fill="#147F85"/><text x="775" y="193" class="code" text-anchor="middle" >MPI_Waitall</text><text x="775" y="227" class="small" text-anchor="middle" >传入两个请求</text><circle cx="970" cy="151" r="7" fill="#147F85"/><text x="970" y="193" class="code" text-anchor="middle" >正常返回</text><text x="970" y="227" class="small" text-anchor="middle" >两个请求均完成</text><rect x="495" y="251" width="242" height="55" rx="14" fill="#E9F4F2" stroke="#147F85" stroke-width="2"/><text x="616" y="286" class="small" text-anchor="middle" >可做无关数据的计算</text><path d="M775 252H965" fill="none" stroke="#D78738" stroke-width="3"/><text x="872" y="287" class="small" text-anchor="middle" >等待所列请求完成</text><text x="44" y="365" class="label" text-anchor="start" >接收缓冲区</text><rect x="260" y="324" width="710" height="68" rx="14" fill="#FFF3E7" stroke="#D78738" stroke-width="2"/><text x="615" y="366" class="body" text-anchor="middle" >不可读取，也不可写入</text><rect x="982" y="324" width="174" height="68" rx="14" fill="#E9F4F2" stroke="#147F85" stroke-width="2"/><text x="1069" y="366" class="body" text-anchor="middle" >可以使用</text><text x="44" y="465" class="label" text-anchor="start" >发送缓冲区</text><rect x="260" y="424" width="185" height="68" rx="14" fill="white" stroke="#DCE6EA" stroke-width="2"/><text x="353" y="465" class="small" text-anchor="middle" >准备数据</text><rect x="460" y="424" width="510" height="68" rx="14" fill="#FFF3E7" stroke="#D78738" stroke-width="2"/><text x="715" y="466" class="body" text-anchor="middle" >不可修改；内存必须保持有效</text><rect x="982" y="424" width="174" height="68" rx="14" fill="#E9F4F2" stroke="#147F85" stroke-width="2"/><text x="1069" y="466" class="body" text-anchor="middle" >可以复用</text><path d="M260 242V317" fill="none" stroke="#147F85" stroke-width="3" stroke-dasharray="7 6"/><path d="M460 242V417" fill="none" stroke="#147F85" stroke-width="3" stroke-dasharray="7 6"/><path d="M970 242V510" fill="none" stroke="#147F85" stroke-width="3" stroke-dasharray="7 6"/><rect x="44" y="540" width="1112" height="104" rx="14" fill="white" stroke="#DCE6EA" stroke-width="2"/><text x="70" y="578" class="body" text-anchor="start" >MPI_Request 是请求句柄类型：用于关联启动操作与完成检查。</text><text x="70" y="616" class="small" text-anchor="start" >Waitall 只等待传入的本地请求；返回后并不表示所有 rank 到达同一程序位置。</text></svg>
