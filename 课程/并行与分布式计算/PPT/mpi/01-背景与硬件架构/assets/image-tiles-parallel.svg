<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="540" viewBox="0 0 1320 540" role="img" aria-labelledby="title description">
<title id="title">高分辨率图像分块与并行输出示意图</title>
<desc id="description">十万乘十万像素的未压缩RGB8图像为30GB，划分为10乘10个块，每块300MB。100个进程各处理一块并输出，保留块的行列坐标，图中展示rank0、rank1和rank99。</desc>
