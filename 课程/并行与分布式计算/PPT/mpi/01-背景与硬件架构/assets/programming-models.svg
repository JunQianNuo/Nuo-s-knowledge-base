<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="OpenMP 共享内存线程模型与 MPI 进程消息传递模型对比">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D37F36"/></marker>
    <style>
      .title{font:700 27px 'Hiragino Sans GB','PingFang SC',sans-serif;fill:#10283F}
      .body{font:18px 'Hiragino Sans GB','PingFang SC',sans-serif;fill:#4E6474}
      .white{font:700 18px 'Hiragino Sans GB','PingFang SC',sans-serif;fill:white}
      .dark{font:700 18px 'Hiragino Sans GB','PingFang SC',sans-serif;fill:#12314A}
    </style>
  </defs>
  <rect width="1200" height="520" fill="#F7FAFB"/>
  <text x="55" y="55" class="title">两种程序模型：数据如何被多个执行者使用？</text>
  <line x1="600" y1="92" x2="600" y2="455" stroke="#CFDDE3" stroke-width="2" stroke-dasharray="8 8"/>

  <text x="72" y="117" class="title">OpenMP：线程共享地址空间</text>
  <rect x="70" y="145" width="475" height="290" rx="20" fill="#E5F2F0" stroke="#87BEBD" stroke-width="2"/>
  <text x="307" y="179" text-anchor="middle" class="body">一个进程</text>
  <g fill="#237B87">
    <rect x="102" y="208" width="90" height="64" rx="10"/>
    <rect x="209" y="208" width="90" height="64" rx="10"/>
    <rect x="316" y="208" width="90" height="64" rx="10"/>
    <rect x="423" y="208" width="90" height="64" rx="10"/>
  </g>
  <g class="white" text-anchor="middle"><text x="147" y="247">线程 0</text><text x="254" y="247">线程 1</text><text x="361" y="247">线程 2</text><text x="468" y="247">线程 3</text></g>
  <g stroke="#237B87" stroke-width="3"><path d="M147 272V324"/><path d="M254 272V324"/><path d="M361 272V324"/><path d="M468 272V324"/></g>
  <rect x="115" y="324" width="385" height="64" rx="11" fill="#A6D8D5"/>
  <text x="307" y="363" text-anchor="middle" class="dark">共享数组 A[ ]</text>
  <text x="307" y="467" text-anchor="middle" class="body">重点：共享 / 私有数据、同步</text>

  <text x="645" y="117" class="title">MPI：进程通过消息协作</text>
  <g>
    <rect x="647" y="169" width="210" height="107" rx="15" fill="#DFE8F3" stroke="#9BAEC6" stroke-width="2"/>
    <rect x="902" y="169" width="210" height="107" rx="15" fill="#DFE8F3" stroke="#9BAEC6" stroke-width="2"/>
    <rect x="647" y="310" width="210" height="107" rx="15" fill="#DFE8F3" stroke="#9BAEC6" stroke-width="2"/>
    <rect x="902" y="310" width="210" height="107" rx="15" fill="#DFE8F3" stroke="#9BAEC6" stroke-width="2"/>
  </g>
  <g text-anchor="middle" class="dark">
    <text x="752" y="206">进程 rank 0</text><text x="1007" y="206">进程 rank 1</text>
    <text x="752" y="347">进程 rank 2</text><text x="1007" y="347">进程 rank 3</text>
  </g>
  <g text-anchor="middle" class="body"><text x="752" y="242">本地数组 A₀[ ]</text><text x="1007" y="242">本地数组 A₁[ ]</text><text x="752" y="383">本地数组 A₂[ ]</text><text x="1007" y="383">本地数组 A₃[ ]</text></g>
  <path d="M858 221H894" stroke="#D37F36" stroke-width="4" marker-end="url(#a)"/>
  <path d="M858 361H894" stroke="#D37F36" stroke-width="4" marker-end="url(#a)"/>
  <text x="877" y="467" text-anchor="middle" class="body">重点：数据分配、消息传递</text>
</svg>
